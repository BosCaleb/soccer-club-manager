# Development only. No resources are provisioned on Azure.
services:
  database:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: clubmanager
      POSTGRES_USER: clubmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clubmanager-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubmanager -d clubmanager"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  clubmanager-data:
