name: Club Manager quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: clubmanager
          POSTGRES_DB: clubmanager
          POSTGRES_PASSWORD: ci-synthetic-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clubmanager -d clubmanager"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_PASSWORD: ci-synthetic-only
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: npm run format:check && npm run lint && npm run build && npm test
      - run: dotnet restore server/ClubManager.Api --locked-mode
      - run: dotnet build server/ClubManager.Api --no-restore
      - run: python3 scripts/test_p1.py
        env:
          P1_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: python3 scripts/manage.py migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-test-results
          path: test-results/
          retention-days: 3
